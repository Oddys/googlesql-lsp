name: ci

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NAME: googlesql_lsp

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos_x86_64, runner: macos-26-intel }
          - { platform: macos_aarch64, runner: macos-26 }
          - { platform: linux_x86_64, runner: ubuntu-22.04 }
          - { platform: linux_aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test --summary all
      - run: zig build -Dcpu=baseline
      # tar keeps the executable bit, which upload-artifact's zip drops
      - name: Package
        run: |
          target=${NAME}_${{ matrix.platform }}
          mkdir $target
          cp LICENSE $target
          cp -r LICENSES $target
          cp zig-out/bin/$target $target
          tar -czf $target.tar.gz -C $target .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}_${{ matrix.platform }}
          path: ${{ env.NAME }}_${{ matrix.platform }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes "$NAME"_*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
